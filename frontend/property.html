<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Property Details</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>

<header class="topbar">
  <div class="brand">Your Accommodation</div>
  <nav>
    <a href="/">Home</a>
    <a href="/#about">About</a>
    <a href="/inquiry.html">Contact</a>
  </nav>
</header>

<main class="container">

  <button onclick="history.back()" class="button back-btn">
    ← Back to Listings
  </button>

  <div id="details" class="details-card">

    <div id="gallery" class="gallery"></div>

    <div class="details-text">

      <h2 id="title"></h2>
      <p id="meta" class="muted"></p>
      <p id="price"></p>
      <p id="desc"></p>

      <!-- QUICK SCAN -->
      <div id="quickInfo" class="info-grid"></div>

      <!-- DETAILS -->
      <div class="section">
        <h3>Accommodation Details</h3>
        <div id="deepDetails" class="info-grid"></div>
      </div>

      <!-- AMENITIES -->
      <div class="section">
        <h3>Amenities & Utilities</h3>
        <div id="amenities" class="tag-list"></div>
      </div>

      <!-- SECURITY -->
      <div class="section">
        <h3>Security Features</h3>
        <div id="security" class="tag-list"></div>
      </div>

      <!-- TRANSPORT -->
      <div class="section">
        <h3>Transport Options</h3>
        <div id="transport" class="tag-list"></div>
      </div>

      <div class="contact-wrap">
        <a id="contactLink" class="button" href="/inquiry.html">
          Contact About This Property
        </a>
      </div>

    </div>
  </div>

</main>

<script>
const qs = new URLSearchParams(location.search);
const id = qs.get('id');

function tagList(target, data) {
  const el = document.getElementById(target);
  el.innerHTML = '';
  if (!data) return;
  data.split(',').forEach(x => {
    if (!x.trim()) return;
    const t = document.createElement('div');
    t.className = 'tag';
    t.innerText = x.trim();
    el.appendChild(t);
  });
}

function formatKM(val) {
  if (!val) return null;
  return `${val} KM`;
}

function formatMins(val) {
  if (!val) return null;
  return `${val} mins`;
}

async function loadProperty() {
  if (!id) return;

  try {
    const res = await fetch(`/properties/${id}`);
    if (!res.ok) throw new Error();
    const p = await res.json();

    const images = p.images ? p.images.split(',') : [];
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';

    if (images.length) {
      const main = document.createElement('img');
      main.src = images[0];
      main.className = 'main-img';
      gallery.appendChild(main);

      const thumbs = document.createElement('div');
      thumbs.className = 'thumbs';

      images.forEach(src => {
        const t = document.createElement('img');
        t.src = src;
        t.className = 'thumb';
        t.onclick = () => main.src = src;
        thumbs.appendChild(t);
      });

      gallery.appendChild(thumbs);
    }

    document.getElementById('title').innerText = p.title || '';
    document.getElementById('meta').innerText = p.location || '';
    document.getElementById('price').innerText = p.price ? `R${p.price} / Month` : '';
    document.getElementById('desc').innerText = p.description || '';

    const qi = document.getElementById('quickInfo');
    qi.innerHTML = '';

    const quick = [
      ['Room Type', p.room_type],
      ['Available For', p.student_types],
      ['Funding', p.funding_options],
      ['Deposit', p.deposit_type === 'YES' ? `R${p.deposit_amount}` : 'None'],
      ['Rooms Available', p.rooms_available ? `We have ${p.rooms_available} rooms available for 6 month students` : null]
    ];

    quick.forEach(x => {
      if (!x[1]) return;
      const d = document.createElement('div');
      d.className = 'info-box';
      d.innerHTML = `<strong>${x[0]}</strong>${x[1]}`;
      qi.appendChild(d);
    });

    const deep = document.getElementById('deepDetails');
    deep.innerHTML = '';

    const deepList = [
      ['Distance From Campus', formatKM(p.distance_from_campus)],
      ['Walking Time', formatMins(p.walking_time)],
      ['Lease Terms', p.lease_terms],
      ['Max Lease', p.max_lease_months ? p.max_lease_months + ' months' : null],
      ['Room Includes', p.room_includes]
    ];

    deepList.forEach(x => {
      if (!x[1]) return;
      const d = document.createElement('div');
      d.className = 'info-box';
      d.innerHTML = `<strong>${x[0]}</strong>${x[1]}`;
      deep.appendChild(d);
    });

    tagList('amenities', [p.amenities, p.utilities].filter(Boolean).join(','));
    tagList('security', p.security_features);
    tagList('transport', p.transport_options);

    document.getElementById('contactLink').href = `/inquiry.html?propertyId=${p.id}`;

  } catch (err) {
    document.getElementById('details').innerHTML = '<p>Could not load property.</p>';
    console.error(err);
  }
}

loadProperty();
</script>

</body>
</html>
