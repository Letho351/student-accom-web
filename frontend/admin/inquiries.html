<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Inquiries — StudentAccomo Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body style="margin:0;background:var(--bg)">

  <script>if (!localStorage.getItem('admin_token')) location.href = '/admin-login.html';</script>

  <!-- TOP BAR -->
  <div class="admin-topbar">
    <div class="brand">Student<span>Accomo</span> <span style="font-size:12px;color:rgba(255,255,255,0.35);font-family:'Plus Jakarta Sans',sans-serif;font-weight:500;">Admin</span></div>
    <div class="admin-topbar-right">
      <div class="admin-user-badge">
        <div class="avatar" id="avatarInitial">A</div>
        <span id="adminUsername">Admin</span>
      </div>
    </div>
  </div>

  <!-- PAGE BODY -->
  <div style="display:flex;min-height:calc(100vh - 60px)">

    <!-- SIDEBAR -->
    <aside style="width:220px;min-width:220px;flex-shrink:0;background:#fff;border-right:1px solid #e5e7eb;padding:20px 14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;box-sizing:border-box;display:flex;flex-direction:column;">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#9ca3af;padding:0 10px;margin-bottom:8px;">Navigation</div>
      <div class="menu-item" onclick="location.href='dashboard.html'"><span class="menu-icon">📊</span> Dashboard</div>
      <div class="menu-item" onclick="location.href='properties.html'"><span class="menu-icon">🏠</span> Properties</div>
      <div class="menu-item active" onclick="location.href='inquiries.html'"><span class="menu-icon">💬</span> Student Inquiries</div>
      <div class="menu-item" onclick="location.href='settings.html'"><span class="menu-icon">⚙️</span> Settings</div>
      <div style="margin-top:auto;padding-top:16px;border-top:1px solid #e5e7eb;">
        <div class="menu-item" onclick="logout()" style="color:#e84f3f;"><span class="menu-icon">🚪</span> Logout</div>
      </div>
    </aside>

    <!-- MAIN -->
    <main style="flex:1;min-width:0;padding:28px 24px;box-sizing:border-box;overflow-x:hidden;">

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
        <h1 style="font-size:24px;font-weight:800;margin:0;">Student Inquiries</h1>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <select id="filterStatus" style="padding:8px 14px;font-size:13px;border-radius:8px;border:1.5px solid #e5e7eb;font-family:inherit;cursor:pointer;">
            <option value="">All Statuses</option>
            <option value="NEW">New</option>
            <option value="CONTACTED">Contacted</option>
            <option value="VIEWING SCHEDULED">Viewing Scheduled</option>
            <option value="PLACED">Placed</option>
            <option value="LOST">Lost</option>
          </select>
          <span id="inqCountBadge" style="font-size:13px;color:#9ca3af;font-weight:500;"></span>
        </div>
      </div>

      <div id="inqList"></div>

    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="admin.js"></script>
  <script>
    const TOKEN = () => localStorage.getItem('admin_token');
    function logout() { localStorage.removeItem('admin_token'); location.href = '/admin-login.html'; }

    try {
      const p = JSON.parse(atob(TOKEN().split('.')[1]));
      document.getElementById('adminUsername').textContent = p.username || 'Admin';
      document.getElementById('avatarInitial').textContent = (p.username||'A')[0].toUpperCase();
    } catch(e) {}

    function showToast(msg, type='default') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.innerHTML = `<span>${{success:'✅',error:'❌',warning:'⚠️',default:'ℹ️'}[type]||'ℹ️'}</span><span>${msg}</span>`;
      c.appendChild(t);
      setTimeout(() => { t.style.animation='toastOut 0.3s ease forwards'; setTimeout(()=>t.remove(),300); }, 3500);
    }

    document.getElementById('filterStatus').addEventListener('change', async () => {
      const desired = document.getElementById('filterStatus').value;
      await window.loadAdminInquiries();
      if (!desired) return;
      document.querySelectorAll('#inqList .inq-card').forEach(card => {
        const sel = card.querySelector('.statusSel');
        card.style.display = (!sel || sel.value === desired) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
