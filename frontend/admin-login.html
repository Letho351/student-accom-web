<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — StudentLink Agency</title>
  <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="admin-login-body">

  <!-- Background layers -->
  <div class="login-grid"></div>
  <div class="login-orb-1"></div>
  <div class="login-orb-2"></div>
  <div class="login-orb-3"></div>
  <div class="login-scan"></div>
  <div class="login-particles" id="particles"></div>

  <!-- Login Card -->
  <div class="login-container">

    <!-- Shield icon -->
    <div class="login-shield"></div>

    <div class="login-brand">StudentLink <span>Agency</span></div>
    <h2>Admin Access</h2>
    <p class="login-sub">Secure portal — authorized personnel only</p>

    <input id="username" placeholder="Username" autocomplete="username" />

    <div class="password-wrap">
      <input id="password" placeholder="Password" type="password" autocomplete="current-password" />
      <button class="password-toggle" id="pwToggle" type="button" aria-label="Toggle password">
        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <div class="login-options">
      <label class="remember-wrap">
        <input type="checkbox" id="rememberMe" />
        <span>Remember me</span>
      </label>
      <button class="forgot-link" type="button" onclick="forgotPassword()">Forgot password?</button>
    </div>

    <button class="login-btn" id="loginBtn">
      <span class="btn-text">Sign In Securely</span>
      <span class="login-spinner"></span>
    </button>

    <p id="msg"></p>

    <div class="login-security">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      256-bit SSL encrypted connection
    </div>

  </div>

  <script>
    // ---- Particles ----
    (function spawnParticles() {
      const container = document.getElementById('particles');
      const colors = ['rgba(181,144,10,0.5)', 'rgba(245,166,35,0.4)', 'rgba(99,102,241,0.4)', 'rgba(255,255,255,0.25)'];
      const sizes  = [3, 4, 5, 6, 3, 4];

      for (let i = 0; i < 28; i++) {
        const p = document.createElement('div');
        p.className = 'login-particle';
        const size  = sizes[Math.floor(Math.random() * sizes.length)];
        const color = colors[Math.floor(Math.random() * colors.length)];
        const left  = Math.random() * 100;
        const delay = Math.random() * 12;
        const dur   = 8 + Math.random() * 10;
        p.style.cssText = `
          width:${size}px; height:${size}px;
          background:${color};
          left:${left}%;
          bottom:${Math.random() * 20}%;
          animation-duration:${dur}s;
          animation-delay:${delay}s;
        `;
        container.appendChild(p);
      }
    })();

    // ---- Remember me: pre-fill username ----
    const saved = localStorage.getItem('sa_remember');
    if (saved) {
      document.getElementById('username').value = saved;
      document.getElementById('rememberMe').checked = true;
    }

    // ---- Password toggle ----
    document.getElementById('pwToggle').addEventListener('click', () => {
      const pw = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pw.type === 'password') {
        pw.type = 'text';
        icon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>`;
      } else {
        pw.type = 'password';
        icon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>`;
      }
    });

    // ---- Single event listeners — no double firing ----
    document.getElementById('loginBtn').addEventListener('click', login);
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !document.getElementById('loginBtn').classList.contains('loading')) login();
    });

    // ---- Login ----
    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('rememberMe').checked;
      const btn      = document.getElementById('loginBtn');
      const msg      = document.getElementById('msg');

      if (!username || !password) {
        msg.textContent = 'Please enter your username and password.';
        shakeContainer();
        return;
      }

      // Loading state
      btn.classList.add('loading');
      msg.textContent = '';

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          msg.textContent = data.error || 'Invalid credentials';
          shakeContainer();
          btn.classList.remove('loading');
          return;
        }

        if (data.token) {
          // Remember me
          if (remember) {
            localStorage.setItem('sa_remember', username);
          } else {
            localStorage.removeItem('sa_remember');
          }

          localStorage.setItem('admin_token', data.token);

          // Success flash
          msg.style.color = '#4ade80';
          msg.textContent = '✅ Access granted. Redirecting...';

          setTimeout(() => {
            window.location.replace('/admin/dashboard.html');
          }, 800);
        }

      } catch (err) {
        console.error(err);
        msg.textContent = 'Server error. Please try again.';
        btn.classList.remove('loading');
      }
    }

    // ---- Shake animation on error ----
    function shakeContainer() {
      const c = document.querySelector('.login-container');
      c.style.animation = 'shake 0.4s ease';
      setTimeout(() => c.style.animation = 'fadeUp 0.6s var(--ease-smooth)', 500);
    }

    // ---- Forgot password ----
    function forgotPassword() {
      const msg = document.getElementById('msg');
      msg.style.color = 'rgba(255,255,255,0.5)';
      msg.textContent = '📧 Contact your system administrator to reset your password.';
    }
  </script>

  <style>
    /* Extra login styles */
    .login-brand {
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }
    .login-brand span { color: var(--coral); }

    .login-container h2 {
      color: rgba(255,255,255,0.9);
      font-size: 20px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .login-sub {
      color: rgba(255,255,255,0.35);
      font-size: 12px;
      margin-bottom: 28px;
    }

    .login-container input {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.09);
      color: #fff;
      border-radius: var(--radius-sm);
      padding: 13px 16px;
      font-size: 14px;
      margin-bottom: 14px;
      transition: all 180ms ease;
      font-family: 'Inter', sans-serif;
    }

    .login-container input::placeholder { color: rgba(255,255,255,0.25); }

    .login-container input:focus {
      border-color: var(--coral);
      box-shadow: 0 0 0 3px rgba(181,144,10,0.18);
      background: rgba(255,255,255,0.07);
      outline: none;
    }

    .password-wrap { position: relative; margin-bottom: 14px; }
    .password-wrap input { margin-bottom: 0; padding-right: 46px; }

    .password-toggle {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: rgba(255,255,255,0.3);
      cursor: pointer; padding: 4px;
      display: flex; align-items: center;
      transition: color 180ms;
    }
    .password-toggle:hover { color: rgba(255,255,255,0.7); }

    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .remember-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .remember-wrap input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: var(--coral);
      cursor: pointer;
      margin: 0; padding: 0;
      border: none;
    }
    .remember-wrap span {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.45);
    }

    .forgot-link {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      background: none; border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: color 180ms;
      padding: 0;
    }
    .forgot-link:hover { color: var(--coral); }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--coral), #9a7a08);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 280ms ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.2px;
      position: relative;
      overflow: hidden;
    }

    .login-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      opacity: 0;
      transition: opacity 200ms;
    }
    .login-btn:hover::after { opacity: 1; }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(181,144,10,0.35); }
    .login-btn:active { transform: scale(0.98); }
    .login-btn.loading { opacity: 0.8; pointer-events: none; }

    .login-spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .login-btn.loading .login-spinner { display: block; }
    .login-btn.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #msg {
      margin-top: 14px;
      font-size: 13px;
      color: #f87171;
      min-height: 20px;
      font-weight: 500;
      transition: color 300ms;
    }

    .login-security {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      font-weight: 500;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-8px); }
      40%       { transform: translateX(8px); }
      60%       { transform: translateX(-5px); }
      80%       { transform: translateX(5px); }
    }

    /* Mobile */
    @media (max-width: 480px) {
      .admin-login-body { align-items: flex-start; padding-top: 48px; }
      .login-container { margin: 16px; padding: 32px 22px; border-radius: 16px; }
      .login-options { flex-direction: column; align-items: flex-start; gap: 10px; }
    }
  </style>

</body>
</html>
