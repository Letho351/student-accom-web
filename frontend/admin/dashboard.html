<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — StudentAccomo Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    /* ADMIN MOBILE FIX */
    @media (max-width: 768px) {
      .admin-topbar { padding: 0 14px !important; height: 54px !important; }
      .admin-topbar .brand { font-size: 15px !important; }
      .admin-user-badge span:not(.avatar) { display: none !important; }
      .page-body { flex-direction: column !important; }
      .admin-aside {
        width: 100% !important; min-width: unset !important;
        height: auto !important; position: static !important;
        border-right: none !important;
        border-bottom: 1px solid #e5e7eb !important;
        flex-direction: row !important; flex-wrap: nowrap !important;
        overflow-x: auto !important; overflow-y: hidden !important;
        padding: 10px 12px !important; gap: 6px !important;
        -webkit-overflow-scrolling: touch; scrollbar-width: none;
      }
      .admin-aside::-webkit-scrollbar { display: none; }
      .nav-label { display: none !important; }
      .admin-aside .menu-item {
        flex-shrink: 0 !important; white-space: nowrap !important;
        padding: 8px 12px !important; font-size: 13px !important;
      }
      .admin-aside .sidebar-logout {
        margin-top: 0 !important; padding-top: 0 !important;
        border-top: none !important; margin-left: auto !important;
        flex-shrink: 0 !important;
      }
      .admin-content, main { padding: 16px 14px !important; overflow-x: hidden !important; }
      .stats-grid { grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
      .stat-card { padding: 14px 12px !important; }
      .stat-card-num { font-size: 22px !important; }
      .charts-grid { grid-template-columns: 1fr !important; gap: 12px !important; }
      .admin-table-wrap { overflow-x: auto !important; }
      .table { min-width: 480px; }
      .form-row { grid-template-columns: 1fr !important; }
      .checkbox-grid { grid-template-columns: 1fr 1fr !important; }
      h1 { font-size: 20px !important; }
    }
    @media (max-width: 480px) {
      .admin-aside .menu-item .menu-text { display: none !important; }
      .admin-aside .menu-item { padding: 10px !important; justify-content: center !important; }
      .admin-aside .menu-item .menu-icon { font-size: 20px !important; margin: 0 !important; }
      .admin-aside { justify-content: space-around !important; padding: 8px !important; }
      .stats-grid { grid-template-columns: 1fr 1fr !important; }
    }
  </style>
</head>
<body style="margin:0;background:var(--bg)">

  <script>if (!localStorage.getItem('admin_token')) location.href = '/admin-login.html';</script>

  <!-- TOP BAR -->
  <div class="admin-topbar">
    <div class="brand">Student<span>Accomo</span> <span style="font-size:12px;color:rgba(255,255,255,0.35);font-family:'Plus Jakarta Sans',sans-serif;font-weight:500;">Admin</span></div>
    <div class="admin-topbar-right">
      <div class="admin-user-badge">
        <div class="avatar" id="avatarInitial">A</div>
        <span id="adminUsername">Admin</span>
      </div>
    </div>
  </div>

  <!-- PAGE BODY -->
  <div class="page-body" style="display:flex;min-height:calc(100vh - 60px)">

    <!-- SIDEBAR -->
    <aside id="sidebar" style="width:220px;min-width:220px;flex-shrink:0;background:#fff;border-right:1px solid #e5e7eb;padding:20px 14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;box-sizing:border-box;display:flex;flex-direction:column;">
      <div class="nav-label" style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#9ca3af;padding:0 10px;margin-bottom:8px;">Navigation</div>

      <div class="menu-item active" onclick="location.href='dashboard.html'">
        <span class="menu-icon">📊</span> <span class="menu-text">Dashboard</span>
      </div>
      <div class="menu-item" onclick="location.href='properties.html'">
        <span class="menu-icon">🏠</span> <span class="menu-text">Properties</span>
      </div>
      <div class="menu-item" onclick="location.href='inquiries.html'">
        <span class="menu-icon">💬</span> <span class="menu-text">Student Inquiries</span>
        <span class="badge-count" id="newInqCount" style="display:none"></span>
      </div>
      <div class="menu-item" onclick="location.href='settings.html'">
        <span class="menu-icon">⚙️</span> <span class="menu-text">Settings</span>
      </div>

      <div style="margin-top:auto;padding-top:16px;border-top:1px solid #e5e7eb;">
        <div class="menu-item" onclick="logout()" style="color:#e84f3f;">
          <span class="menu-icon">🚪</span> <span class="menu-text">Logout</span>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <main style="flex:1;min-width:0;padding:28px 28px;box-sizing:border-box;overflow-x:hidden;">

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
        <h1 style="font-size:24px;font-weight:800;margin:0;">Dashboard</h1>
        <span style="font-size:13px;color:#9ca3af;" id="lastUpdated"></span>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="stat-card-icon navy">🏠</div><div class="stat-card-num" id="sTotal">—</div><div class="stat-card-label">Total Properties</div></div>
        <div class="stat-card"><div class="stat-card-icon green">✅</div><div class="stat-card-num" id="sAvail">—</div><div class="stat-card-label">Available</div></div>
        <div class="stat-card"><div class="stat-card-icon coral">💬</div><div class="stat-card-num" id="sInq">—</div><div class="stat-card-label">Total Inquiries</div></div>
        <div class="stat-card"><div class="stat-card-icon gold">🆕</div><div class="stat-card-num" id="sNew">—</div><div class="stat-card-label">New Inquiries</div></div>
      </div>

      <!-- Charts -->
      <div class="charts-grid" style="margin-top:24px;">
        <div class="chart-card">
          <h4>Inquiries by Status</h4>
          <canvas id="statusChart" height="220"></canvas>
        </div>
        <div class="chart-card">
          <h4>Rooms Available per Property</h4>
          <canvas id="roomsChart" height="220"></canvas>
        </div>
      </div>

      <!-- Recent Inquiries -->
      <div class="admin-table-wrap" style="margin-top:24px;">
        <div class="admin-table-header">
          <h3>Recent Inquiries</h3>
          <a href="inquiries.html" style="font-size:13px;color:var(--coral);font-weight:600;">View all →</a>
        </div>
        <div id="recentInq" style="padding:16px;">Loading...</div>
      </div>

    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="admin.js"></script>
  <script>
    const TOKEN = () => localStorage.getItem('admin_token');

    function logout() {
      localStorage.removeItem('admin_token');
      location.href = '/admin-login.html';
    }

    function showToast(msg, type='default') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.innerHTML = `<span>${{success:'✅',error:'❌',warning:'⚠️',default:'ℹ️'}[type]||'ℹ️'}</span><span>${msg}</span>`;
      c.appendChild(t);
      setTimeout(() => { t.style.animation='toastOut 0.3s ease forwards'; setTimeout(()=>t.remove(),300); }, 3500);
    }

    // Set username
    try {
      const payload = JSON.parse(atob(TOKEN().split('.')[1]));
      document.getElementById('adminUsername').textContent = payload.username || 'Admin';
      document.getElementById('avatarInitial').textContent = (payload.username||'A')[0].toUpperCase();
    } catch(e) {}

    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();

    async function loadDashboard() {
      const token = TOKEN();
      try {
        const [propRes, inqRes] = await Promise.all([
          fetch('/properties'),
          fetch('/admin/inquiries', { headers: { Authorization: 'Bearer ' + token } })
        ]);
        const props = await propRes.json();
        const inqs  = await inqRes.json();

        // Stats
        document.getElementById('sTotal').textContent = props.length;
        document.getElementById('sAvail').textContent = props.filter(p => Number(p.rooms_available) > 0).length;
        document.getElementById('sInq').textContent   = inqs.length;
        const newCount = inqs.filter(i => i.status === 'NEW').length;
        document.getElementById('sNew').textContent   = newCount;
        if (newCount > 0) {
          const badge = document.getElementById('newInqCount');
          badge.textContent = newCount;
          badge.style.display = 'inline-block';
        }

        // Status chart
        const statuses = ['NEW','CONTACTED','VIEWING SCHEDULED','PLACED','LOST'];
        const counts   = statuses.map(s => inqs.filter(i => i.status === s).length);
        new Chart(document.getElementById('statusChart'), {
          type: 'doughnut',
          data: {
            labels: statuses,
            datasets: [{ data: counts, backgroundColor: ['#3b82f6','#f5a623','#8b5cf6','#22c55e','#e84f3f'], borderWidth: 0 }]
          },
          options: { plugins: { legend: { position: 'bottom', labels: { font: { family: 'Plus Jakarta Sans', size: 12 }, padding: 14 } } }, cutout: '65%' }
        });

        // Rooms chart
        const top8   = props.filter(p => p.rooms_available).slice(0, 8);
        new Chart(document.getElementById('roomsChart'), {
          type: 'bar',
          data: {
            labels: top8.map(p => p.title?.length > 14 ? p.title.slice(0,14)+'…' : p.title),
            datasets: [{ label: 'Rooms', data: top8.map(p => p.rooms_available), backgroundColor: '#e84f3f', borderRadius: 6 }]
          },
          options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { font: { family: 'Plus Jakarta Sans' } } }, x: { ticks: { font: { family: 'Plus Jakarta Sans', size: 11 } } } } }
        });

        // Recent inquiries
        const recent = inqs.slice(0, 5);
        document.getElementById('recentInq').innerHTML = recent.length ? recent.map(i => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f3f4f6;flex-wrap:wrap;gap:6px;">
            <div>
              <strong style="font-size:14px;">${i.name||''}</strong>
              <span style="font-size:12px;color:#9ca3af;margin-left:8px;">${i.house||'N/A'}</span>
            </div>
            <span class="status-badge ${(i.status||'new').toLowerCase().replace(' ','-')}">${i.status||'NEW'}</span>
          </div>`).join('') : '<p style="color:#9ca3af;text-align:center;padding:20px 0;">No inquiries yet</p>';

      } catch(err) {
        console.error(err);
        showToast('Failed to load dashboard data', 'error');
      }
    }

    loadDashboard();
  </script>
</body>
</html>
