<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Properties — StudentLink Agency Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    /* ADMIN MOBILE FIX */
    @media (max-width: 768px) {
      .admin-topbar { padding: 0 14px !important; height: 54px !important; }
      .admin-topbar .brand { font-size: 15px !important; }
      .admin-user-badge span:not(.avatar) { display: none !important; }
      .page-body { flex-direction: column !important; }
      .admin-aside {
        width: 100% !important; min-width: unset !important;
        height: auto !important; position: static !important;
        border-right: none !important;
        border-bottom: 1px solid #e5e7eb !important;
        flex-direction: row !important; flex-wrap: nowrap !important;
        overflow-x: auto !important; overflow-y: hidden !important;
        padding: 10px 12px !important; gap: 6px !important;
        -webkit-overflow-scrolling: touch; scrollbar-width: none;
      }
      .admin-aside::-webkit-scrollbar { display: none; }
      .nav-label { display: none !important; }
      .admin-aside .menu-item {
        flex-shrink: 0 !important; white-space: nowrap !important;
        padding: 8px 12px !important; font-size: 13px !important;
      }
      .admin-aside .sidebar-logout {
        margin-top: 0 !important; padding-top: 0 !important;
        border-top: none !important; margin-left: auto !important;
        flex-shrink: 0 !important;
      }
      .admin-content, main { padding: 16px 14px !important; overflow-x: hidden !important; }
      .stats-grid { grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
      .stat-card { padding: 14px 12px !important; }
      .stat-card-num { font-size: 22px !important; }
      .charts-grid { grid-template-columns: 1fr !important; gap: 12px !important; }
      .admin-table-wrap { overflow-x: auto !important; }
      .table { min-width: 480px; }
      .form-row { grid-template-columns: 1fr !important; }
      .checkbox-grid { grid-template-columns: 1fr 1fr !important; }
      h1 { font-size: 20px !important; }
    }
    @media (max-width: 480px) {
      .admin-aside .menu-item .menu-text { display: none !important; }
      .admin-aside .menu-item { padding: 10px !important; justify-content: center !important; }
      .admin-aside .menu-item .menu-icon { font-size: 20px !important; margin: 0 !important; }
      .admin-aside { justify-content: space-around !important; padding: 8px !important; }
      .stats-grid { grid-template-columns: 1fr 1fr !important; }
    }
  </style>
</head>
<body style="margin:0;background:var(--bg)">

  <script>if (!localStorage.getItem('admin_token')) location.href = '/admin-login.html';</script>

  <!-- TOP BAR -->
  <div class="admin-topbar">
    <div class="brand">StudentLink <span>Agency</span> <span style="font-size:12px;color:rgba(255,255,255,0.35);font-family:'Inter',sans-serif;font-weight:500;">Admin</span></div>
    <div class="admin-topbar-right">
      <div class="admin-user-badge">
        <div class="avatar" id="avatarInitial">A</div>
        <span id="adminUsername">Admin</span>
      </div>
    </div>
  </div>

  <!-- PAGE BODY -->
  <div class="page-body" style="display:flex;min-height:calc(100vh - 60px)">

    <!-- SIDEBAR -->
    <aside class="admin-aside" style="width:220px;min-width:220px;flex-shrink:0;background:#fff;border-right:1px solid #e5e7eb;padding:20px 14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;box-sizing:border-box;display:flex;flex-direction:column;">
      <div class="nav-label" style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#9ca3af;padding:0 10px;margin-bottom:8px;">Navigation</div>
      <div class="menu-item" onclick="location.href='dashboard.html'"><span class="menu-icon">📊</span> <span class="menu-text">Dashboard</span></div>
      <div class="menu-item active" onclick="location.href='properties.html'"><span class="menu-icon">🏠</span> <span class="menu-text">Properties</span></div>
      <div class="menu-item" onclick="location.href='inquiries.html'"><span class="menu-icon">💬</span> <span class="menu-text">Student Inquiries</span></div>
      <div class="menu-item" onclick="location.href='settings.html'"><span class="menu-icon">⚙️</span> <span class="menu-text">Settings</span></div>
      <div style="margin-top:auto;padding-top:16px;border-top:1px solid #e5e7eb;">
        <div class="menu-item" onclick="logout()" style="color:var(--coral);"><span class="menu-icon">🚪</span> <span class="menu-text">Logout</span></div>
      </div>
    </aside>

    <!-- MAIN -->
    <main style="flex:1;min-width:0;padding:28px 24px;box-sizing:border-box;overflow-x:hidden;">

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
        <h1 style="font-size:24px;font-weight:800;margin:0;">Properties</h1>
        <p id="propMsg" style="font-size:13px;color:var(--available);font-weight:600;margin:0;"></p>
      </div>

      <!-- ADD/EDIT FORM -->
      <div id="formArea" style="background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:24px;margin-bottom:24px;box-shadow:0 2px 8px rgba(0,0,0,0.04);">
        <h3 id="formTitle" style="margin:0 0 20px 0;font-size:18px;font-weight:800;">Add Property</h3>

        <form id="propertyForm" enctype="multipart/form-data">

          <label for="title">Title</label>
          <input id="title" name="title" placeholder="Property title" required />

          <label for="location">Location</label>
          <input id="location" name="location" placeholder="Full address / area" required />

          <div class="form-row">
            <div>
              <label for="price">Price (R/month)</label>
              <input id="price" name="price" type="number" min="0" placeholder="e.g. 3500" required />
            </div>
            <div>
              <label for="room_type">Room Type</label>
              <select id="room_type" name="room_type" required>
                <option value="">Select room type</option>
                <option value="Single">Single</option>
                <option value="Sharing">Sharing</option>
              </select>
            </div>
          </div>

          <label>Distance to VUT</label>
          <div class="form-row">
            <input id="distance_km" name="distance_km" type="number" step="0.1" placeholder="Distance (km)" />
            <input id="walking_time" name="walking_time" type="number" placeholder="Walking time (minutes)" />
          </div>

          <label>Transport Options</label>
          <div class="checkbox-grid">
            <label><input type="checkbox" name="transport" value="Taxi"> Taxi</label>
            <label><input type="checkbox" name="transport" value="Bus"> Bus</label>
            <label><input type="checkbox" name="transport" value="Campus Shuttle"> Campus Shuttle</label>
            <label><input type="checkbox" name="transport" value="Train"> Train</label>
            <label><input type="checkbox" name="transport" value="Walking Distance"> Walking Distance</label>
          </div>

          <label>Security Features</label>
          <div class="checkbox-grid">
            <label><input type="checkbox" name="security" value="24/7 Security"> 24/7 Security</label>
            <label><input type="checkbox" name="security" value="CCTV"> CCTV</label>
            <label><input type="checkbox" name="security" value="Biometric Access"> Biometric Access</label>
            <label><input type="checkbox" name="security" value="Controlled Gate"> Controlled Gate</label>
            <label><input type="checkbox" name="security" value="Electric Fence"> Electric Fence</label>
          </div>

          <label>Amenities</label>
          <div class="checkbox-grid">
            <label><input type="checkbox" name="amenities" value="WiFi"> WiFi</label>
            <label><input type="checkbox" name="amenities" value="Laundry"> Laundry</label>
            <label><input type="checkbox" name="amenities" value="Study Area"> Study Area</label>
            <label><input type="checkbox" name="amenities" value="Cleaning"> Cleaning</label>
            <label><input type="checkbox" name="amenities" value="Parking"> Parking</label>
            <label><input type="checkbox" name="amenities" value="TV Lounge"> TV Lounge</label>
          </div>

          <label>Room Includes</label>
          <div class="checkbox-grid">
            <label><input type="checkbox" name="room_includes" value="Bed"> Bed</label>
            <label><input type="checkbox" name="room_includes" value="Desk"> Desk</label>
            <label><input type="checkbox" name="room_includes" value="Chair"> Chair</label>
            <label><input type="checkbox" name="room_includes" value="Wardrobe"> Wardrobe</label>
            <label><input type="checkbox" name="room_includes" value="Curtains"> Curtains</label>
            <label><input type="checkbox" name="room_includes" value="Heater"> Heater</label>
          </div>

          <label>Utilities</label>
          <div class="checkbox-grid">
            <label><input type="checkbox" name="utilities" value="Water Included"> Water Included</label>
            <label><input type="checkbox" name="utilities" value="Electricity Included"> Electricity Included</label>
            <label><input type="checkbox" name="utilities" value="Backup Water"> Backup Water</label>
            <label><input type="checkbox" name="utilities" value="Backup Solar"> Backup Solar</label>
          </div>

          <label>Lease Terms</label>
          <div class="form-row">
            <select id="lease_term" name="lease_term">
              <option value="10">Minimum 10 Months</option>
              <option value="6">Minimum 6 Months</option>
            </select>
            <input id="six_month_rooms" name="six_month_rooms" type="number" min="0" placeholder="Rooms for 6-month lease" />
          </div>

          <label for="student_types">Student Types <span style="font-weight:400;color:#9ca3af;">(hold Ctrl/Cmd to multi-select)</span></label>
          <select id="student_types" name="student_types" multiple size="3" required>
            <option value="VUT">VUT</option>
            <option value="NWU">NWU</option>
            <option value="Sedibeng">Sedibeng</option>
          </select>

          <label for="funding_options">Funding Options <span style="font-weight:400;color:#9ca3af;">(hold Ctrl/Cmd to multi-select)</span></label>
          <select id="funding_options" name="funding_options" multiple size="2">
            <option value="Self-funded">Self-funded</option>
            <option value="Bursary">Bursary</option>
          </select>

          <label for="description">Description</label>
          <textarea id="description" name="description" placeholder="Describe the property..."></textarea>

          <label>Deposit & Rooms Available</label>
          <div class="form-row">
            <select id="deposit_type" name="deposit_type">
              <option value="NO">No Deposit</option>
              <option value="YES">Deposit Required</option>
            </select>
            <input id="deposit_amount" name="deposit_amount" type="number" min="0" placeholder="Deposit Amount (R)" />
          </div>

          <input id="rooms_available" name="rooms_available" type="number" min="0" placeholder="Rooms Available" required />

          <label for="images" style="margin-top:14px;">Upload Images</label>
          <input id="images" name="images" type="file" multiple accept="image/*" />

          <p id="dupWarning" style="color:#e84f3f;display:none;font-size:13px;font-weight:600;margin-top:8px;padding:10px 14px;background:#fee2e2;border-radius:8px;border:1px solid #fca5a5;"></p>

          <div style="display:flex;gap:10px;margin-top:18px;">
            <button id="saveBtn" type="submit" class="btn btn--primary">Save Property</button>
            <button id="cancelBtn" type="button" class="btn btn--ghost">Cancel</button>
          </div>

        </form>
      </div>

      <!-- PROPERTY LIST -->
      <div class="admin-table-wrap">
        <div class="admin-table-header">
          <h3>All Properties</h3>
        </div>
        <div id="listArea" style="padding:8px 0;"></div>
      </div>

    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="admin.js"></script>
  <script>
    // Decode JWT for username display only — everything else handled by admin.js
    try {
      const p = JSON.parse(atob(TOKEN().split('.')[1]));
      document.getElementById('adminUsername').textContent = p.username || 'Admin';
      document.getElementById('avatarInitial').textContent = (p.username||'A')[0].toUpperCase();
    } catch(e) {}
  </script>
</body>
</html>
