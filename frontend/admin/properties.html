<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin — Properties</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <script>
    if (!localStorage.getItem("admin_token")) location.href = '/admin-login.html';
  </script>

  <div class="container">
    <h1>Properties</h1>

    <div class="admin-wrap">
      <aside class="admin-sidebar">
        <strong>Menu</strong>
        <div class="menu-item" data-href="dashboard.html">Dashboard</div>
        <div class="menu-item active" data-href="properties.html">Properties</div>
        <div class="menu-item" data-href="inquiries.html">Student Inquiries</div>
        <div class="menu-item" data-href="settings.html">Settings</div>
        <div style="margin-top:12px">
          <button onclick="logout()">Logout</button>
        </div>
      </aside>

      <main class="admin-main">

        <!-- Add / Edit Property Form -->
        <div id="formArea" style="margin-bottom:18px;">
          <h3 id="formTitle">Add Property</h3>

          <!-- 🔥 REAL FORM (IMPORTANT) -->
          <form id="propertyForm" style="max-width:800px;" enctype="multipart/form-data">

            <input id="title" placeholder="Title" />

            <input id="location" placeholder="Location" />

            <div class="form-row">
              <input id="price" placeholder="Price (numbers only)" />
              <select id="room_type">
                <option value="">Room type</option>
                <option>Single</option>
                <option>Sharing</option>
              </select>
            </div>

            <label>Student types (hold Ctrl/Cmd to multi-select)</label>
            <select id="student_types" multiple size="4">
              <option>VUT</option>
              <option>NWU</option>
              <option>Sedibeng</option>
            </select>

            <label>Funding options (hold Ctrl/Cmd to multi-select)</label>
            <select id="funding_options" multiple size="3">
              <option>Self-funded</option>
              <option>Bursary</option>
            </select>

            <textarea id="description" placeholder="Description"></textarea>

            <label>Deposit & Rooms</label>
            <div class="form-row">
              <select id="deposit_type">
                <option value="NO">No Deposit</option>
                <option value="YES">Deposit Required</option>
              </select>
              <input id="deposit_amount" placeholder="Deposit Amount (R)" />
            </div>

            <input id="rooms_available" type="number" placeholder="Rooms Available" />

            <label>Upload images (you can choose multiple)</label>
            <!-- 🔥 NAME MUST MATCH upload.array('images') -->
            <input id="images" name="images" type="file" multiple accept="image/*" />

            <div style="margin-top:10px;">
              <button id="saveBtn" type="submit">Save</button>
              <button id="cancelBtn" type="button" class="muted">Cancel</button>
            </div>

            <p id="propMsg"></p>
          </form>
        </div>

        <!-- Properties List -->
        <div id="listArea"></div>

      </main>
    </div>
  </div>

  <script src="admin.js"></script>

  <!-- 🔥 Prevent browser submit + keep files intact -->
  <script>
    const form = document.getElementById('propertyForm');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        saveProperty();
      });
    }

    document.getElementById('cancelBtn')?.addEventListener('click', () => {
      document.getElementById('formArea').style.display = 'none';
      document.getElementById('propertyForm').reset();
      window.editPropertyId = null;
    });
  </script>

</body>
</html>
